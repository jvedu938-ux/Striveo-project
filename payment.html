<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments | STRIVEO</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#111;
    color:#fff;
}

header{
    width:100%;
    background:#1b1b1b;
    border-bottom:3px solid gold;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 40px;
    position:sticky;
    top:0;
    z-index:1000;
}
logo{
    font-size:28px;
    font-weight:bold;
    color:gold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-size:16px;
    transition:.3s;
}

nav a:hover,
nav .active{
    color:gold;
}

.container{
    width:90%;
    margin:35px auto;
}

.page-title{
    font-size:32px;
    margin-bottom:30px;
    color:gold;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:35px;
}

.card{
    background:#1d1d1d;
    padding:25px;
    border-radius:12px;
    border-left:5px solid gold;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h3{
    font-size:17px;
    color:#ddd;
    margin-bottom:10px;
}

.card h2{
    color:gold;
    font-size:28px;
}

.section{
    background:#1b1b1b;
    padding:25px;
    border-radius:12px;
    margin-bottom:30px;
}

.section h2{
    color:gold;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
}

input,
select{
    width:100%;
    padding:12px;
    border:none;
    outline:none;
    border-radius:8px;
    background:#2b2b2b;
    color:white;
}

button{
    background:gold;
    color:black;
    border:none;
    padding:12px 22px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

.search-box{
    margin-bottom:20px;
}

.search-box input{
    width:100%;
}

.table-box{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

table th{
    background:gold;
    color:black;
    padding:14px;
}

table td{
    background:#222;
    text-align:center;
    padding:14px;
    border-bottom:1px solid #333;
}

.status-paid{
    color:#00ff66;
    font-weight:bold;
}

.status-pending{
    color:#ff5555;
    font-weight:bold;
}

.delete-btn{
    background:#ff4444;
    color:white;
    padding:8px 14px;
}

.delete-btn:hover{
    background:#dd2222;
}

footer{
    text-align:center;
    padding:20px;
    color:#bbb;
    margin-top:40px;
    border-top:1px solid #333;
}

@media(max-width:768px){

header{
flex-direction:column;
gap:15px;
}

nav{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

nav a{
margin:8px;
}

.page-title{
font-size:25px;
}

}

</style>

</head>

<body>

<header>

<div class="logo">STRIVEO</div>

<nav>
<a href="partner.html">Dashboard</a>
<a href="project.html">Projects</a>
<a href="client.html">Clients</a>
<a href="payment.html" class="active">Payments</a>
<a href="report.html">reports</a>
<a href="setting.html"class="active">setting</a>
</nav>

</header>

<div class="container">

<h1 class="page-title">Payment Management</h1>

<div class="cards">

<div class="card">
<h3>Total Revenue</h3>
<h2 id="revenue">₹0</h2>
</div>

<div class="card">
<h3>Pending Amount</h3>
<h2 id="pending">₹0</h2>
</div>

<div class="card">
<h3>Total Payments</h3>
<h2 id="payments">0</h2>
</div>

<div class="card">
<h3>Completed</h3>
<h2 id="completed">0</h2>
</div>

</div>

<div class="section">

<h2>Add New Payment</h2>

<div class="form-grid">

<input type="text" id="client" placeholder="Client Name">

<input type="text" id="project" placeholder="Project Name">

<input type="number" id="amount" placeholder="Amount">

<select id="status">
<option value="Paid">Paid</option>
<option value="Pending">Pending</option>
</select>

<button onclick="addPayment()">Add Payment</button>

</div>

</div>

<div class="section">

<h2>Payment History</h2>

<div class="search-box">
<input type="text" id="search" placeholder="Search Client..." onkeyup="searchPayment()">
</div>

<div class="table-box">

<table>

<thead>

<tr>
<th>Client</th>
<th>Project</th>
<th>Amount</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody id="paymentTable">

</tbody>

</table>

</div>

</div>

</div>

<footer>

© 2026 STRIVEO | Payment Management System

</footer>

<script>

let payments = JSON.parse(localStorage.getItem("payments")) || [];

function saveData(){
    localStorage.setItem("payments",JSON.stringify(payments));
}

function renderTable(){

    let table=document.getElementById("paymentTable");

    table.innerHTML="";

    let revenue=0;
    let pending=0;
    let completed=0;

    payments.forEach((payment,index)=>{

        if(payment.status==="Paid"){
            revenue+=Number(payment.amount);
            completed++;
        }else{
            pending+=Number(payment.amount);
        }

        table.innerHTML+=`

        <tr>

        <td>${payment.client}</td>

        <td>${payment.project}</td>

        <td>₹${payment.amount}</td>

        <td class="${payment.status==="Paid" ? "status-paid":"status-pending"}">

        ${payment.status}

        </td>

        <td>

        <button class="delete-btn" onclick="deletePayment(${index})">

        Delete

        </button>

        </td>

        </tr>

        `;

    });

    document.getElementById("revenue").innerHTML="₹"+revenue;
    document.getElementById("pending").innerHTML="₹"+pending;
    document.getElementById("payments").innerHTML=payments.length;
    document.getElementById("completed").innerHTML=completed;

    saveData();

}

function addPayment(){

    let client=document.getElementById("client").value.trim();

    let project=document.getElementById("project").value.trim();

    let amount=document.getElementById("amount").value;

    let status=document.getElementById("status").value;

    if(client==="" || project==="" || amount===""){

        alert("Please fill all fields.");

        return;

    }

    payments.push({

        client:client,

        project:project,

        amount:amount,

        status:status

    });

    document.getElementById("client").value="";

    document.getElementById("project").value="";

    document.getElementById("amount").value="";

    document.getElementById("status").value="Paid";

    renderTable();

}

function deletePayment(index){

    if(confirm("Delete this payment?")){

        payments.splice(index,1);

        renderTable();

    }

}

function searchPayment(){

    let filter=document.getElementById("search").value.toLowerCase();

    let rows=document.querySelectorAll("#paymentTable tr");

    rows.forEach(row=>{

        let client=row.cells[0].textContent.toLowerCase();

        if(client.indexOf(filter)>-1){

            row.style.display="";

        }

        else{

            row.style.display="none";

        }

    });

}

renderTable();

</script>

</body>
</html>
